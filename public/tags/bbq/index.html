                "tags": ["cheese","fresh","portuguese",],
                "content": "Makes enough for single 4in. cheese form or three 2in. cheese forms. Can also make for four 4in. cheese forms.\nIngredients For single 4\u0026quot; cheese form or three 2\u0026quot; cheese forms\n4 cups of whole milk (do not use Ultra Pasteurized Milk) 1/2 tsp of powdered rennet salt to taste For four 4\u0026quot; cheese forms 1 Gallon of whole milk (do not use Ultra Pasteurized Milk) 2 tsp of powered rennet salt to taste Directions Heat milk on low until lukewarm (about 97°F). Do not overheat the milk. Once milk is at desired temperature add powdered rennet and mix well. Once rennet is fully dissolved remove pan from heat and set aside for 30-45 minutes for milk to coagulate and begin to form curds. Place cheese form(s) on a plate with a lip (or wide bowl) to hold excess whey that will release over time. As the milk coagulates, use a slotted spoon to fill the forms with curds. As the curds set in their form(s) liquid whey will slowly pour out of the holes in them. Press down carefully on the curds to help press out the whey. This helps create a firmer cheese. Sprinkle salt to taste and refrigerate overnight. The following day, place another plate over your form and carefully flip the cheese upside down over a sink to drain out all excess whey that has collected. Then place the plate back in the refrigerator for another 24 hours. Repeat this step if necessary, cheese should be ready to eat on the third day. ",

            "http:\/\/localhost:1313\/recipe-book\/recipes\/one-pot-paprika-chicken-rice\/": {
                
                "title": "One-Pot Paprika Chicken Rice",
                "tags": ["one-pot","chicken","rice",],
                "content": "Makes 4 servings. Adapted from https://simplehomeedit.com/recipe/one-pot-crispy-chicken-and-red-rice/\nIngredients Chicken 1.2 kg (2 lb 10 oz) bone-in chicken thigh cutlets, skin on (5–6 chicken thigh cutlets) 2 tbsp olive oil 1 tbsp dried herbs (oregano, thyme or Italian herb mix) 1 tbsp sweet paprika 1 tsp onion powder 1/2 tsp smoked paprika 1/2 tsp cracked black pepper 1/2 tsp sea salt flakes 1 onion, finely diced 4 garlic cloves, finely chopped 2 tbsp tomato paste (concentrated puree) 1.5 cups (300 g) white rice (jasmine or basmati) 3 cups (750 ml) chicken stock Fresh coriander (cilantro) or flat-leaf (Italian) parsley, roughly chopped, to serve (optional) Cucumber Salad 3 Lebanese (Persian) cucumbers, finely sliced Juice of 1/2 lemon 1/2 tsp sea salt flakes 1/2 tsp cracked black pepper 3 tbsp sour cream Directions Preheat the oven to 180°C (350°F) (all oven types). In a large bowl, coat the chicken with olive oil, dried herbs, sweet paprika, onion powder, smoked paprika, black pepper and salt. Use your hands to ensure even coverage. In an oven-safe, heavy-based frying pan, sear the chicken on medium heat for 3–5 minutes until golden and crispy. Set aside. In the same pan, add the onion and garlic (see note 2 if the pan is sticky). Cook for 1–2 minutes until softened. Add the tomato paste and rice, stirring to combine. Pour in the chicken stock. Return the chicken to the pan, ensuring the skin is facing up. Cover the pan tightly with a lid or foil. Bake for 35 minutes in the oven. Remove the cover and bake for another 10 minutes. Allow the dish to rest, covered, for 10 minutes before serving, and top with fresh herbs if using. To make the cucumber salad, combine all ingredients and serve with the chicken and rice. Notes What can I serve with One-pot Paprika Chicken and Rice? This meal pairs well with just about anything! The suggested cucumber and sour cream salad is a refreshing addition, but you could also serve it with steamed greens like broccoli, broccolini (tenderstem broccoli), green beans, snow peas (mangetout) or kale. A fresh green salad or roasted vegetables (cauliflower, broccoli, pumpkin/butternut squash, zucchini/courgette, eggplant/aubergine, brussels sprouts or capsicum/bell peppers) would be great too. For an extra creamy option, a dollop of Greek yoghurt or tzatziki works beautifully, as would a sprinkle of creamy feta!\nCan I use boneless chicken thighs instead of bone-in chicken thigh cutlets? Yes! Whole boneless chicken thighs can be used in this One-pot Paprika Chicken and Rice. Sear the chicken thighs as per the recipe, then set aside. Follow the recipe, but do not return the chicken thighs to the pan. Cook the rice, covered, for 20 minutes first, and then add the chicken. Cook for a further 15 minutes, covered, then cook for an additional 10 minutes, uncovered, and finally leave to stand for 10 minutes before serving, as per the recipe.\nCan I use brown rice instead of white rice? Yes, but you’ll need to adjust the cooking time. Brown rice takes longer to cook, so increase the oven cooking time by 15–20 minutes, and add 1 additional cup (250 ml) of chicken stock (4 cups/1 litre total). Make sure the rice is cooked through before serving.\nHow can I spice it up? Add ½ teaspoon of ground cayenne pepper or dried chilli (red pepper) flakes to the chicken marinade, or finish with a sprinkle of dried chilli flakes or a drizzle of chilli oil.\n",

                "content": "Ingredients Sweet Shortcrust Pastry 6 ounces butter (softened) 1/2 cup sugar 1 egg 2 cups all-purpose flour pinch salt 1/4 tsp almond extract Filling 4 cups milk 1/2 cup sugar 2 eggs 3 Tbsp cornstarch 3 Tbsp all-purpose flour 1 tsp vanilla extract pinch salt 1 Tbsp ground cinnamon Directions for the crust Preheat oven to 350°F (177°C). Grease a pie dish and set aside. Cream the butter and add the sugar. Beat in the egg and almond extract. Stir in the flour and salt. Knead until a soft dough has formed. Chill for 10 minutes. Roll the dough out onto a lightly floured surface and layer it into a greased pie dish. Cover with a sheet of parchment paper and fill the void with pie weights. Bake blind at 350°F (177°C) for 15 minutes or more. Make sure the crust is fully cooked. Remove parchment and pie weights. Allow crust to cool completely on a wire rack. for the filling In a heat proof bowl, whisk together the eggs, sugar, cornstarch, flour and vanilla extract. Set aside. In a medium size saucepan, heat the milk and butter at medium setting. Do not bring to a rolling boil. Add about a fourth of the milk to the egg mixture, whisking to incorporate it evenly. Pour the mixture back into the saucepan with the remainder of the milk. Return to heat and stir constantly until it thickens. Do not boil! This part may take a long time. Be patient! Pour the filling into the pie crust and let cool completely. Refrigerate until serving. Sprinkle with cinnamon on the top of the custard before serving. ",

                "content": "Ingredients 3 pounds sweet potatoes (peeled and cut into cubes) 1/2 cup brown sugar (packed) 1/3 cup salted butter (softened) 1/2 tsp vanilla extract 3/4 cup chopped pecans (divided) 1/4 tsp cinnamon (or to taste) salt and black pepper (to taste) 2 cups miniature marshmallows Directions Preheat oven to 375F. Grease a 9 x 13 pan. Place sweet potatoes in a pot of boiling water. Simmer for 15 minutes or until fork tender. Drain. In a large bowl (or in the pot the potatoes were cooked in), mash the sweet potatoes with brown sugar, butter, cinnamon, vanilla and salt \u0026amp; pepper. Fold in half of the pecans and spread into prepared pan. Sprinkle with the marshmallows and the remaining pecans. Bake for 25 minutes or until marshmallows are golden brown and potatoes are heated through. Note\nLight or dark brown sugar can be used. If using unsalted butter, add extra salt if needed. This can be made up to 48 hours ahead of time. Prepare and refrigerate before baking, keeping the topping in a separate container. Remove the sweet potato casserole from the fridge at least 30 minutes before baking. Bake for 20 minutes and then stir. Add the topping and cook for 15-20 minutes longer or until heated through and the marshmallows are toasty. ",

                "tags": ["beef","bbq","korean","ribs",],
                "content": "Makes 4 servings.\nIngredients 3-4 pounds cross-cut beef short ribs (flanken or LA galbi cut) about 1/3-inch thick Marinade 1/2 Korean/Asian pear (or 1 apple), grated or blend the next 3 ingredients in a blender or food processor 2 Tbsp. minced garlic (about 6 plump cloves) 1/2 medium onion, grated 1 tsp. minced ginger (about 1 inch chunk) 1/2 cup soy sauce 1/2 cup water 3-4 Tbsp. sugar (can reduce sugar and add more pear or Korean plum syrup) 2 Tbsp. honey 1/4 cup cooking rice wine (mirin) 2 Tbsp. sesame oil 3 scallions finely chopped 1/2 tsp. black pepper 1 tsp. sesame seeds (Optional) Directions For the ribs:\nRinse the ribs to wash off bone dust and remove some blood on the surface. Place the ribs in a large bowl with water and add a tablespoon of sugar to the water with the ribs. This helps with remove blood from the ribs and creating better tasting ribs. Soak for about 20 minutes. For the marinade:\nBlend the pear (or apple) together with the onion, garlic, and ginger in a blender or food processor. Mix all the marinade ingredients well in a large bowl or container. Add the meat to the marinade and coat each rib with the marinade. Marinate the meat for 6-8 hours (overnight for best results). Flip them over half way through. The thicker the meat, the longer you’ll want to marinate. Cooking the ribs:\nGrilling: Preheat the grill over medium-high heat. Grill the short ribs, turning only once, 2-3 minutes on each side. You can use charcoal or wood charcoal (soot bul) grill, gas grill, or a grill pan over the stove top. Broiling in the oven: Set the oven to broil and preheat. Lay the meat in a single layer on a broiling pan and place it on the top rack of the oven, usually about 6 inches below the broiler. Cook until the ribs are slightly charred and caramelized, 5 to 6 minutes. Flip them over and cook for an additional 3 – 4 minutes. Watch closely not to burn them. Pan-frying: Preheat a large non-stick pan. Reduce the heat to medium. Lay the short ribs in a single layer, 4 or 5 ribs depending on the size of the pan. Cook for 4 to 5 minutes. When the pan is getting dry. Add the marinade through a strainer. Flip them over and cook for another 4 to 5 minutes until all the sauce is gone and the ribs are nicely browned. ",

                "url": "http:\/\/localhost:1313\/recipe-book\/recipes\/la-galbi\/",

            "http:\/\/localhost:1313\/recipe-book\/recipes\/vodka-sauce\/": {
                
                "title": "Vodka Sauce",
                "tags": ["pasta","easy","vegetarian",],
                "content": "Makes 4 servings.\nIngredients Kosher salt 1 medium onion 4 or more garlic cloves 4 oz. Parmesan cheese 2 Tbsp. extra-virgin olive oil, plus more drizzling 4.5 oz double-concentrated tomato paste 1/2 tsp. crushed red pepper flakes 2 oz. (1/4 cup) vodka 3/4 cup heavy cream 1 lb. rigatoni basil leaves (for serving) 1 lb. Italian sausage (Optional)1 Directions Fill a stock pot or other large pot three-quarters full with water and heat over high. Toss in a handful of kosher salt and bring to a boil while you do your other prep. Peel and finely chop 1 medium onion. Firmly smash 4 garlic cloves with the flat side of a chef\u0026rsquo;s knife and remove peel. Grate 4 oz. Parmesan on the smallest holes of the box grater. Warm 2 Tbsp. extra-virgin olive oil in a Dutch oven or other heavy large pot over medium heat (position it next to pot of water). Add onion and garlic and cook, stirring constantly, just until onion is starting to brown around the edges, 5–7 minutes. Add 4.5-oz. double-concentrated tomato paste and ½ tsp. crushed red pepper flakes and stir until paste evenly coats onion. Continue to cook, stirring often, until paste is deep red and starting to brown on bottom of pot, 5–7 minutes. Add 2 oz. (1/4 cup) vodka to deglaze pan and stir to incorporate, scraping bottom of pot. Reduce heat to low. Using a heatproof glass measuring cup, scoop about 1/4 cup boiling water from pot, then add 3/4 cup heavy cream to measuring cup (this brings up the temperature of the cream so it won\u0026rsquo;t break when you add it to the pot). Slowly add warmed cream to Dutch oven, stirring constantly, until a smooth sauce forms. Remove from heat. Add 1 lb. rigatoni to pot of boiling salted water; cook pasta according to package instructions until al dente. About 1 minute before the timer goes off, use heatproof measuring cup to scoop up about 1 cup pasta cooking liquid. Heat Dutch oven over low. Transfer rigatoni to Dutch oven along with any water that’s piggybacking on the pasta. Add 1/2 cup pasta cooking liquid to Dutch oven and stir to incorporate, then gradually add half of Parmesan, stirring constantly to melt cheese. You should have a smooth, glossy sauce that coats each piece of pasta. Season with salt and add a splash more pasta water to thin sauce, if needed. Divide pasta among bowls. Top with remaining Parmesan, dividing evenly. Drizzle with more oil, then tear basil leaves over. Add sausage as a non-vegetarian version. You can cook this after the onion and garlic.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n", 
                "url": "http:\/\/localhost:1313\/recipe-book\/recipes\/vodka-sauce\/",

                "tags": ["korean","stew","spam","spicy",],
                "content": "Makes 4 servings. Adapted from https://www.10000recipe.com/recipe/6884636\nIngredients 1 cup kimchi 1 package kielbasa (or vienna sausages)1 1 can spam 1 block of tofu 1 cup sliced rice cakes 4 stalks large scallions 2 green chillies 1 package enoki mushrooms 1 onion 1 package (500g) beef bone soup (사골곰탕)2 1 packet of ramen noodles (only noodles)3 2 cups water Sauce Ingredients 2 Tbsp doenjang (Korean soybean paste) 6-8 Tbsp gochugaru (Korean pepper flakes) 4 Tbsp minced garlic 4 Tbsp soy sauce 1 Tbsp gochujang (Korean pepper paste) 1 Tbsp sugar 2-3 Tbsp water Directions Cut the tofu and slice the green chillies. Cut spam into slices. Cut the sausages in an angle. Rinse the rice cakes in water. Use scissors to cut the kimchi into bite size pieces. Slice the onions. Tear the enoki mushrooms into thinner strips. Prepare the sauce in a separate bowl by mixing all the sauce ingredients together. Set aside. In a large pot, add the tofu, sausage, rice cakes, and kimchi. Then add the sauce in the middle. Add onions and mushrooms on top. Add the beef bone soup and water. Add the chillies and scallions. Let everything boil. Once the ingredients are cooked, add the ramen noodles and let that cook as well. Serve with rice once the ramen noodle seems to be done al dente. I prefer the kielbasa but vienna sausages or anytime of processed sausages are great for this stew!\u0026#160;\u0026#x21a9;\u0026#xfe0e;\nNo worries, if you don\u0026rsquo;t have this. You can just substitute with water. However, the stew is much more flavorful with the bone soup.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\nCook the noodles towards the end since they can get mushy and overcooked very easily. I prefer rice cakes over ramen noodles, but the noodles are very iconic.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n",

                "content": "Makes about 2-3 pancakes depending on size.\nIngredients 2 cups kimchi 1/3 cup kimchi juice 1/2 Tbsp minced garlic 1 cup Korean pancake mix (부침가루)1 2/3 cup water oil as much as you need for frying Directions Place the kimchi in a large bowl and use a scissor to cut them into small pieces. Add the Korean pancake mix, 1/3 cup kimchi juice, and 1/2 Tbsp of minced garlic to the bowl with the kimchi. Add 2/3 cup of water. Mix the batter. Adjust the level of water by adding more water or more pancake mix to get the right consistency. Fry the pancake batter with oil in a pan. Cook on both sides until golden brown. Serve while hot. Another trick that some folks do is to mix Korean pancake mix and Korean frying mix (튀김가루) 1:1 ratio to create a crispier pancake.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n",

                "content": "Makes about 4 servings.\nIngredients Main Ingredients 1 Kg (2.2 lbs) beef short ribs (English style cut) 1/3 radish (daikon) 5 shiitake mushrooms 1-2 large carrots 2 green chillies 1 stalk of large scallion 1 cup rice cakes (tteokbokki style) some sweet potato vermicelli (Optional)1 Cooking Meat Ingredients 2 liters (8 cups) water 1 stalk of large scallion cut into 2-3 chunks 5 cloves of garlic 1 onion cut into quarters or eighths 1 dried red chilli small amount of whole peppercorns Sauce Ingredients 8 Tbsp soy sauce 4 Tbsp gochugaru (고추가루) 5 Tbsp mirin (맛술) 3 Tbsp sweetner (plum syrup or corn syrup or agave syrup) 3 Tbsp sugar 1 Tbsp minced garlic 1/2 Tbsp fresh garlic juice small amount of ground pepper Directions Place the short ribs in a bowl of cold water for about 1 hour to get the blood out. Then, blanch the ribs in hot water and rince in cold water. In a dutch oven or large pot, add the short ribs and all the ingredients for cooking meat. Let it boil with a lid for 1 hour. Prepare the sauce in a large bowl by mixing all the suace ingredients together. Set aside. After boiling for about an hour, remove the ribs from the pot and remove any excess fat and tendons. Then, add the short ribs into the bowl of sauce and mix well. Strain the liquid used for boiling the meat. We will use the liquid. Prepare the radish and carrots by cutting them into cubes and rounding the edges. Rounding the edges prevent them from falling apart as they cook. Prepare the mushrooms, rice cakes, green chillies, and the scallions. Rice cakes cane be cut into bite size. Mushrooms can be sliced into thirds while the rest can be sliced thinly. Add the marinated short ribs, 2 cups of liquid from boiling the meat, radish, and carrots to a dutch oven or large pot and boil for 20 minutes. After the radish and carrots are cooked through, add the mushrooms, rice cakes, green chillies, and scallions and boil for another 5 minutes. To serve, add some extra thinly sliced scallions and roasted sesame seeds. Eat with rice. Cook the noodles ahead of time and then add it to the dish towards the end.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n",

                "content": "Makes 4 servings.\nIngredients 1 block (12 to 15 ounces) extra-firm tofu 1 tablespoon olive oil 1 tablespoon tamari or soy sauce 1 tablespoon cornstarch or arrowroot starch Directions Preheat the oven to 400 degrees Fahrenheit and line a large, rimmed baking sheet with parchment paper. To prepare the tofu: Drain the tofu and use your palms to gently squeeze out some of the water. Slice the tofu into thirds lengthwise so you have 3 even slabs. Stack the slabs on top of each other and slice through them lengthwise to make 3 even columns, then slice across to make 5 even rows. Line a cutting board with a lint-free tea towel or paper towels, then arrange the tofu in an even layer on the towel(s). Fold the towel(s) over the cubed tofu, then place something heavy on top (like another cutting board, topped with a cast iron pan or anything weighty) to help the tofu drain. Let the tofu rest for at least 10 minutes (preferably more like 30 minutes, if you have the time). Transfer the pressed tofu to a medium mixing bowl and drizzle with the olive oil and tamari/soy sauce. Toss to combine. Sprinkle the starch over the tofu, and toss the tofu until the starch is evenly coated, so there are no powdery spots remaining. Add the tofu onto prepared baking sheet and arrange the tofu in an even layer. Bake for 25 to 30 minutes, tossing the tofu halfway, until the tofu is deeply golden on the edges. ",

                "content": "Makes about 5-6 pancakes depending on size.\nIngredients Pancake Batter 1 bunch of scallions cut into thin, 1 inch length 1/2 onion thinly sliced 1-2 large carrots julienned 1 red pepper julienned 1 cup of frozen seafood mix (can also do diced shrimp, squid - calamari, diced imitation crab) 500g of Korean pancake mix (부침가루)1 800ml of water oil as much as you need for frying Dipping Sauce 2 Tbsp sugar 4 Tbsp soy sauce 2 Tbsp vinegar (I use rice vinegar) 1 Tbsp of Korean pepper powder (gochugaru - 고추가루) chopped green chilis for some extra kick! Directions Wash and prepare all the pancake batter ingredients (veggies and seafood). In a bowl, combine the Korean pancake mix and water together. Whisk together until there are no clumps. Mix in the chopped seafood and vegetables to the batter. On Medium High heat, add 2-3 Tbsp cooking oil. When heated, pour a small amount of batter. Just create your desired size/shape! Lower the heat depending on how the pancake is doing. Continue with the remaining batter and be generous with the oil. Having enough oil is key to a crispy pancake! Make the dipping sauce by mixing all the ingredients together. Another trick that some folks do is to mix Korean pancake mix and Korean frying mix (튀김가루) 1:1 ratio to create a crispier pancake.\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n",

                "content": "Makes 4 servings.\nIngredients 3 Tbsp olive oil 1 large onion, chopped 4 garlic cloves, minced1 1 Tbsp tomato paste 1 tsp ground cumin 1/4 tsp ground black pepper 1/2 tsp ground chile powder or cayenne pepper, more to taste2 1 quart of chicken or vegetable stock (leaving out the added 2 cups of water from original recipe3) 1 cup red lentils 2~3 large carrots, peeled \u0026amp; diced salt to taste juice of 1/2~1 lemon 3 Tbsp chopped fresh cilantro Directions In a large pot, heat 3 Tbsp olive oil over high heat until shimmering. Add onion and garlic. Saute until golden, about 4 min. Stir in tomato paste, cumin, black pepper, and chile powder. Saute another 2 min. Add stock, lentils, and carrot. Bring to simmer, then cover and turn heat to medium-low. Simmer until lentils are soft, about 30 min. Taste and add salt if needed. Puree soup with immersion blender. Don\u0026rsquo;t over-blend: soup should be somewhat chunky. Stir in lemon juice and cilantro. doubled values, not originals\u0026#160;\u0026#x21a9;\u0026#xfe0e;\nadding a little more than original recipe\u0026#160;\u0026#x21a9;\u0026#xfe0e;\nused stock and not broth; left out the water\u0026#160;\u0026#x21a9;\u0026#xfe0e;\n",
